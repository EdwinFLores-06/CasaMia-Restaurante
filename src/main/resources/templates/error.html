<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>

    <style>

        body{
            font-family: Arial;
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            background:white;
            padding:40px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
            text-align:center;
            width:400px;
        }

        h1{
            color:#c0392b;
        }

        p{
            margin-top:15px;
        }

        a{
            display:inline-block;
            margin-top:20px;
            padding:10px 20px;
            background:#27ae60;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }

    </style>

</head>
<body>

<div class="card">

    <h1 th:text="${titulo}"></h1>

    <p th:text="${error}"></p>

    <p th:text="${detalle}"></p>

    <a href="/home">Volver al inicio</a>

</div>

</body>
</html>
