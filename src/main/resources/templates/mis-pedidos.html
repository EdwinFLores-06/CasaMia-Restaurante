<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/CSS/cliente-mobile.css}">
    <link rel="manifest" href="/manifest.json">
    
    <meta name="theme-color" content="#1f3d2b">

    <meta name="mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Mis Pedidos - Casa Mia</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI';
            background: #D8D3CB;
        }

        .navbar {
            background: #1f3d2b;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        .container {
            padding: 40px;
        }

        h1 {
            color: #1f3d2b;
        }

        .pedido {
            background: #E7E5E2;
            padding: 22px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 14px rgba(0,0,0,.08);
            border-left: 7px solid #1f3d2b;
        }

        .estado {
            padding: 8px 14px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            display: inline-block;
            margin-top: 8px;
        }

        .activo {
            background: #f39c12;
        }

        .entregado {
            background: #27ae60;
        }

        ul {
            padding-left: 20px;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            color: #1f3d2b;
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>Casa Mia</h2>
    <div>
        <a href="/home">Inicio</a>
        <a href="/menu">Menú</a>
        <a href="/logout">Salir</a>
    </div>
</div>

<div class="container">

    <h1>Mis pedidos</h1>

    <div th:if="${#lists.isEmpty(ordenes)}">
        <h3>No tienes pedidos registrados todavía.</h3>
    </div>

    <div class="pedido" th:each="orden : ${ordenes}">

        <h2>Pedido #<span th:text="${orden.idOrden}"></span></h2>

        <p>
            Fecha:
            <span th:text="${orden.fecha}"></span>
        </p>

        <p>
            Dirección:
            <span th:text="${orden.direccion}"></span>
        </p>

        <p>
            Pago:
            <span th:text="${orden.pago}"></span>
        </p>

        <span
            th:class="${orden.estado == 'ENTREGADO'} ? 'estado entregado' : 'estado activo'"
            th:text="${orden.estado}">
        </span>

        <h4>Platillos:</h4>

        <ul>
            <li th:each="d : ${orden.detalles}">
                <span th:text="${d.nombreProducto}"></span>
                -
                $<span th:text="${#numbers.formatDecimal(d.precio,1,2)}"></span>
            </li>
        </ul>

        <p class="total">
            Total:
            $<span th:text="${#numbers.formatDecimal(orden.total,1,2)}"></span>
        </p>

    </div>

</div>
<script src="/pwa.js"></script>
</body>
</html>
