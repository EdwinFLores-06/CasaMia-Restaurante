<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Órdenes - Empleados</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
            background: #f5f1e8;
        }

        /* NAVBAR */

        .navbar {

            background: #1f3d2b;
            color: white;

            padding: 20px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            font-size: 24px;
        }

        .btn-regresar {

            background: #c8a96a;

            color: white;

            text-decoration: none;

            padding: 10px 18px;

            border-radius: 10px;

            font-size: 15px;

            transition: 0.3s;
        }

        .btn-regresar:hover {
            background: #b89355;
        }

        /* CONTENIDO */

        .container {
            padding: 30px;
        }

        /* CARD ORDEN */

        .orden {

            background: white;

            padding: 20px;

            border-radius: 12px;

            margin-bottom: 20px;

            border-left: 6px solid #1f3d2b;

            box-shadow: 0 5px 12px rgba(0,0,0,0.08);
        }

        .estado {

            font-weight: bold;

            color: #c8a96a;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin-bottom: 8px;
        }

        /* BOTONES */

        button {

            background: #1f3d2b;

            color: white;

            border: none;

            padding: 10px 15px;

            border-radius: 8px;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background: #2d5a40;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

    <div>
        📋 Órdenes recibidas - Casa Mia
    </div>

    <a href="/empleado" class="btn-regresar">
    ⬅ Volver al panel
    </a>

</div>

<!-- CONTENIDO -->

<div class="container">

    <!-- SI NO HAY ORDENES -->

    <div th:if="${#lists.isEmpty(ordenes)}">

        <h3>No hay órdenes todavía.</h3>

    </div>

    <!-- ORDENES -->

    <div class="orden" th:each="orden : ${ordenes}">

        <h2>
            Orden #
            <span th:text="${orden.idOrden}"></span>
        </h2>

        <p>
            Fecha:
            <span th:text="${orden.fecha}"></span>
        </p>

        <p>
            Estado:
            <span
                class="estado"
                th:text="${orden.estado}">
            </span>
        </p>

        <h4>Productos:</h4>

        <ul>

            <li th:each="d : ${orden.detalles}">

                <span th:text="${d.nombreProducto}"></span>

                -

                $<span th:text="${d.precio}"></span>

            </li>

        </ul>

        <h3>
            Total:
            <span th:text="${#numbers.formatDecimal(orden.total,1,2)}"></span>
        </h3>

        <!-- BOTON COMPLETAR -->

        <a th:href="@{/empleado/ordenes/completar/{id}(id=${orden.idOrden})}">

            <button>
                ✔ Marcar como completada
            </button>

        </a>

    </div>

</div>

</body>
</html>
