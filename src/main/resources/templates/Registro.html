<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Registro - Casa Mia</title>
    <link rel="stylesheet" th:href="@{/css/cliente-mobile.css}">
    <link rel="manifest" href="/manifest.json">
    
    <meta name="theme-color" content="#1f3d2b">

    <meta name="mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background:
                url("/img/restaurante.png")
                center center / cover
                no-repeat fixed;
            color: white;
        }

        .overlay {
            min-height: 100vh;
            background:
                linear-gradient(
                    rgba(17,32,24,0.82),
                    rgba(17,32,24,0.90)
                );
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 20px;
        }

        .register-box {
            width: 420px;
            background: rgba(255,255,255,0.13);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.22);
            padding: 38px;
            border-radius: 28px;
            box-shadow: 0 15px 40px rgba(0,0,0,.35);
        }

        .logo {
            text-align: center;
            margin-bottom: 18px;
        }

        .logo img {
            width: 105px;
            height: 105px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.35);
            box-shadow: 0 8px 20px rgba(0,0,0,.35);
        }

        h2 {
            text-align: center;
            font-size: 34px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #f0d6a5;
            margin-bottom: 25px;
            font-weight: 500;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            color: #f5f5f5;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.88);
            color: #1f3d2b;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #c8a96a;
            box-shadow: 0 0 0 3px rgba(200,169,106,.25);
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #c8a96a;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        button:hover {
            background: #d8b97d;
            transform: translateY(-2px);
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #f5f5f5;
        }

        .login-link a {
            color: #f0d6a5;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error,
        .success {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            text-align: center;
            font-size: 14px;
        }

        .error {
            background: rgba(178,34,34,0.9);
            color: white;
        }

        .success {
            background: rgba(31,122,58,0.9);
            color: white;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #f5f5f5;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home:hover {
            color: #f0d6a5;
        }
    </style>
</head>

<body>

<div class="overlay">

    <div class="register-box">

        <div class="logo">
            <img th:src="@{/img/image.png}" alt="Logo Casa Mia">
        </div>

        <h2>REGISTRO</h2>

        <p class="subtitle">
            Crea tu cuenta en Casa Mia
        </p>

        <form method="post" th:action="@{/registro}">

            <label>Correo o usuario</label>
            <input
                    type="text"
                    name="username"
                    placeholder="Ingresa tu correo"
                    required>

            <label>Contraseña</label>
            <input
                    type="password"
                    name="password"
                    placeholder="Crea una contraseña"
                    required>

            <label>Confirmar contraseña</label>
            <input
                    type="password"
                    name="confirmPassword"
                    placeholder="Repite tu contraseña"
                    required>

            <button type="submit">
                Crear cuenta
            </button>

        </form>

        <div th:if="${param.existe}" class="error">
            Ese usuario ya existe.
        </div>

        <div th:if="${param.password}" class="error">
            Las contraseñas no coinciden.
        </div>

        <div th:if="${param.registrado}" class="success">
            Cuenta creada correctamente. Ya puedes iniciar sesión.
        </div>

        <div class="login-link">
            ¿Ya tienes cuenta?
            <a th:href="@{/login}">Iniciar sesión</a>
        </div>

        <a class="back-home" th:href="@{/login}">
            ← Volver al login
        </a>

    </div>

</div>
<script src="/pwa.js"></script>
</body>
</html>
