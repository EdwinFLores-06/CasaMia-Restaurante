<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Empleado Menú | Casa Mia</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial;
            background:#f5f1e8;
        }

        .navbar{
            background:#1f3d2b;
            color:white;
            padding:20px;
            font-size:24px;
            font-weight:bold;
        }

        .container{
            display:flex;
        }

        .sidebar{
            width:250px;
            background:#2e5d3b;
            min-height:100vh;
            padding:20px;
        }

        .sidebar a{
            display:block;
            color:white;
            text-decoration:none;
            margin:15px 0;
            padding:12px;
            border-radius:8px;
            transition:0.3s;
        }

        .sidebar a:hover{
            background:#1f3d2b;
        }

        .content{
            flex:1;
            padding:30px;
        }

        h2{
            color:#1f3d2b;
            margin-bottom:20px;
        }

        .form-box{
            background:white;
            padding:25px;
            border-radius:15px;
            margin-bottom:30px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        .form-box input,
        .form-box select{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:10px;
        }

        .form-box label{
            display:block;
            margin-top:10px;
            color:#1f3d2b;
            font-weight:bold;
        }

        .save-btn{
            background:#1f3d2b;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:10px;
            cursor:pointer;
            font-size:16px;
        }

        .save-btn:hover{
            background:#2e5d3b;
        }

        table{
            width:100%;
            background:white;
            border-radius:15px;
            overflow:hidden;
            border-collapse:collapse;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        th{
            background:#1f3d2b;
            color:white;
            padding:15px;
        }

        td{
            padding:15px;
            border-bottom:1px solid #ddd;
            text-align:center;
        }

        img{
            width:90px;
            height:70px;
            object-fit:cover;
            border-radius:10px;
        }

        .edit-btn{
            background:#c8a96a;
            color:white;
            border:none;
            padding:8px 12px;
            border-radius:8px;
            cursor:pointer;
        }

        .delete-btn{
            background:#b22222;
            color:white;
            border:none;
            padding:8px 12px;
            border-radius:8px;
            cursor:pointer;
        }

        .categoria-badge {
            background:#c8a96a;
            color:white;
            padding:6px 10px;
            border-radius:20px;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="navbar">
    🍽 Panel Empleado - Gestión de Menú
</div>

<div class="container">

    <div class="sidebar">

        <a href="/empleado">🏠 Inicio empleado</a>
        <a href="/empleado/menu">🍽 Menú</a>
        <a href="/empleado/inventario">📦 Inventario</a>
        <a href="/empleado/ordenes">📋 Órdenes</a>
        <a href="/empleado/pedidos">📦 Pedidos</a>
        <a href="/empleado/reservas">📅 Reservaciones</a>
        <a href="/logout">🚪 Cerrar sesión</a>

    </div>

    <div class="content">

        <h2>Gestión del Menú</h2>

        <div class="form-box">

            <form
                    th:action="@{/empleado/menu/guardar}"
                    method="post"
                    enctype="multipart/form-data"
                    th:object="${producto}">

                <input type="hidden" th:field="*{idProducto}">

                <label>Nombre</label>
                <input
                        type="text"
                        th:field="*{nombre}"
                        placeholder="Nombre del producto"
                        required>

                <label>Precio</label>
                <input
                        type="number"
                        step="0.01"
                        th:field="*{precio}"
                        placeholder="Precio"
                        required>

                <label>Categoría</label>
                    <select th:field="*{categoria}" required>

                        <option value="">
                            Selecciona una categoría
                        </option>

                        <option value="Entradas">
                            🥗 Entradas
                        </option>

                        <option value="Platillos">
                            🍽 Platillos
                        </option>

                        <option value="Bebidas heladas">
                            🧊 Bebidas heladas
                        </option>

                        <option value="Bebidas calientes">
                            ☕ Bebidas calientes
                        </option>

                        <option value="Postres dulces">
                            🍰 Postres dulces
                        </option>

                        <option value="Postres salados">
                            🥨 Postres salados
                        </option>

                    </select>

                <label>Descripción</label>
                <input
                        type="text"
                        th:field="*{descripcion}"
                        placeholder="Descripción">

                <label>Foto del producto</label>

                <input
                        type="file"
                        name="archivoImagen"
                        accept="image/*">

                <button type="submit" class="save-btn">
                    Guardar Producto
                </button>

            </form>

        </div>

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Imagen</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="p : ${productos}">

                <td th:text="${p.idProducto}"></td>

                <td>
                    <img th:src="${p.imagen}" alt="Imagen">
                </td>

                <td th:text="${p.nombre}"></td>

                <td>
                    <span class="categoria-badge" th:text="${p.categoria}"></span>
                </td>

                <td>
                    $<span th:text="${#numbers.formatDecimal(p.precio,1,2)}"></span>
                </td>

                <td th:text="${p.cantidad}"></td>

                <td>
                    <a th:href="@{/empleado/menu/editar/{id}(id=${p.idProducto})}">
                        <button class="edit-btn">Editar</button>
                    </a>

                    <a th:href="@{/empleado/menu/eliminar/{id}(id=${p.idProducto})}">
                        <button class="delete-btn">Eliminar</button>
                    </a>
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
